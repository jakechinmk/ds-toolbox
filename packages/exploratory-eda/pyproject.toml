[project]
name = "exploratory-eda"
version = "0.1.0"
description = "exploratory toolbox for machine learning utilising dataprep & sweetviz"
authors = [
    {name = "Jake Chin",email = "jakechin.mk@gmail.com"}
]
readme = "README.md"
requires-python = ">3.10, <3.11"
dependencies = [
    "dataprep (>=0.4.5,<0.5.0)",
    "sweetviz (>=2.3.1,<3.0.0)",
    "pyarrow (>=20.0.0,<21.0.0)",
    "fastparquet (>=2024.11.0,<2025.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
